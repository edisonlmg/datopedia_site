project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/"

website:
  title: "Datopedia"
  site-url: "https://datopedia.org"
  google-analytics: G-73XYP0Y0DX
  description: "Liberación de datos públicos: convertimos informes PDFs y reportes no estructurados o procesables en datasets abiertos y consumibles."
  favicon: images/favicon.svg
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: "#152238"
    foreground: "#F4F2EA"
    logo: images/sello.svg
    logo-alt: "Datopedia"
    title: "Datopedia"
    left:
      - href: index.qmd
        text: "Inicio"
      - href: presentacion.qmd
        text: "Presentación"
      - href: blog.qmd
        text: "Blog"
      - href: datos-abiertos.qmd
        text: "Datos abiertos"
    right:
      - icon: github
        href: https://github.com/edisonlmg/datopedia_site.git
        text: "Repositorio GitHub"
        target: _blank

  page-footer:
    background: "#152238"
    foreground: "#C9CDD6"
    left: "© 2026 Datopedia — datos públicos liberados."
    center: "Publicado bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)."
    right:
      - icon: github
        href: https://github.com/edisonlmg/datopedia_site.git
      - icon: rss
        href: blog.xml

  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - styles/datopedia.scss
    css: styles/styles.css
    toc: false
    grid:
      body-width: 900px
    code-fold: true
    link-external-newwindow: true
    smooth-scroll: true

execute:
  freeze: false
  echo: false
  warning: false
  message: false

lang: es

editor: source
